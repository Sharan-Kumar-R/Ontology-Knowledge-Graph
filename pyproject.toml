[project]
name = "kg"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pandas",         # parsed records -> Parquet, and back
    "pyarrow",        # the Parquet engine pandas uses
    "pydantic>=2",    # settings validation
    "pyyaml",         # reads config/settings.yaml
    "typer",          # the CLI
    "neo4j",          # graph driver
    "rdflib",         # ontology parsing and RDF export
    "pyshacl",        # SHACL validation
]

[project.optional-dependencies]
reasoning = ["owlready2"]   # HermiT, used by tests/test_ontology.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires a running Neo4j"]
